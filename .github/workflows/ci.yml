
name: My First CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run automated tests
        run: python -m pytest -v
      - name: Create CI report
        run: echo "CI tests completed successfully" > ci-report.txt

  second-job:
    needs: first-job
    runs-on: ubuntu-latest

    steps:
      - name: Show second job
        run: echo "This is my second CI job."
